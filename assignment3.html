<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Assignment 3</title>
</head>

<body>
    <h2>Assignment 3: Grade Calculator</h2>
    <p>Open F12 → Console to see the result.</p>
    <script>
        const score = 85;
        let grade;

        if (score < 0 || score > 100) {
            console.log("Invalid score");
        } else {
            if (score >= 90) grade = "A";
            else if (score >= 80) grade = "B";
            else if (score >= 70) grade = "C";
            else if (score >= 60) grade = "D";
            else grade = "F";

            switch (grade) {
                case "A": console.log("Grade: A"); break;
                case "B": console.log("Grade: B"); break;
                case "C": console.log("Grade: C"); break;
                case "D": console.log("Grade: D"); break;
                default: console.log("Grade: F");
            }

            const status = score >= 40 ? "Passed" : "Failed";
            console.log(`Score: ${score}`);
            console.log(`Status: ${status}`);
        }
    </script>
</body>

</html>
